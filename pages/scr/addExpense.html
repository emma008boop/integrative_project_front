<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kays</title>
    <link rel="stylesheet" href="../../css/pages/scr/stylesPriv.css">
    <link rel="stylesheet" href="../../css/components/scr/sideNav.css">
    <link rel="stylesheet" href="../../css/pages/scr/addExpense.css">
</head>
<body>
    <div class="interface-layout">

        <nav class="side-nav">
            <div class="nav-brand">
                <span class="logo">K</span>
            </div>
            
            <div class="nav-links">
                <a href="./dashboard.html" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                </a>
                <a href="./addExpense.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                </a>
            </div>

            <div class="nav-user">
                <div class="avatar">EB</div>
            </div>
        </nav>

        <section class="analysis-section">
            <div class="input-scanner">
                <div class="url-input-wrapper">
                    <input type="url" id="product-url" placeholder="Paste the product link here..." autocomplete="off">
                    <div class="input-glow"></div>
                </div>

                <div id="product-preview" class="product-preview-card hidden">
                    <div class="product-visual">
                        <img id="p-image" src="" alt="Product Preview">
                    </div>
                    <div class="product-info">
                        <h3 id="p-title">Analyzing product...</h3>
                        <p id="p-description">Fetching data from the source.</p>
                        
                        <div class="necessity-meter">
                            <label>Urgency Level</label>
                            <div class="steps" id="steps-container">
                                <button type="button" class="step" data-value="1">1</button>
                                <button type="button" class="step" data-value="2">2</button>
                                <button type="button" class="step" data-value="3">3</button>
                                <button type="button" class="step" data-value="4">4</button>
                                <button type="button" class="step" data-value="5">5</button>
                            </div>
                        </div>

                        <button id="add-to-track" class="btn-primary">Track Asset</button>
                    </div>
                </div>
            </div>
        </section>

    </div>
</body>
</html>
